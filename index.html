<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atividade Tailwind</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

  <header>
    <nav class="bg-gray-800 text-white">
      <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between">
        <a href="#" class="text-xl">UCSAL</a>
        <button id="botaoMenu" type="button" class="lg:hidden border border-gray-500 rounded px-3 py-1 text-xl cursor-pointer" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">☰</button>
        <ul id="menu" class="hidden w-full mt-2 lg:flex lg:w-auto lg:gap-4 lg:mt-0">
          <li><a class="block py-2 text-gray-300 hover:text-white" href="#destaques">Destaques</a></li>
          <li><a class="block py-2 text-gray-300 hover:text-white" href="#cursos">Cursos</a></li>
          <li><a class="block py-2 text-gray-300 hover:text-white" href="#horarios">Horários</a></li>
          <li><a class="block py-2 text-gray-300 hover:text-white" href="#contato">Contato</a></li>
          <li><a class="block py-2 text-gray-300 hover:text-white" href="#inscricao">Inscrição</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 my-6">

    <section id="destaques" class="mb-12">
      <h2 class="text-3xl mb-4">Destaques</h2>
      <div class="relative overflow-hidden">
        <div id="slides" class="flex transition-transform duration-500">
          <img src="https://placehold.co/1200x400/343a40/ffffff?text=Cursos" class="w-full shrink-0" alt="Cursos da UCSAL">
          <img src="https://placehold.co/1200x400/343a40/ffffff?text=Campus" class="w-full shrink-0" alt="Campus da UCSAL">
          <img src="https://placehold.co/1200x400/343a40/ffffff?text=Eventos" class="w-full shrink-0" alt="Eventos da UCSAL">
        </div>
        <button id="anterior" type="button" class="absolute left-0 top-0 h-full px-4 text-white text-3xl cursor-pointer" aria-label="Slide anterior">‹</button>
        <button id="proximo" type="button" class="absolute right-0 top-0 h-full px-4 text-white text-3xl cursor-pointer" aria-label="Próximo slide">›</button>
        <div class="absolute bottom-3 left-0 right-0 flex justify-center gap-2">
          <button type="button" class="ponto w-3 h-3 rounded-full bg-white cursor-pointer" aria-label="Slide 1" aria-current="true"></button>
          <button type="button" class="ponto w-3 h-3 rounded-full bg-white opacity-50 cursor-pointer" aria-label="Slide 2" aria-current="false"></button>
          <button type="button" class="ponto w-3 h-3 rounded-full bg-white opacity-50 cursor-pointer" aria-label="Slide 3" aria-current="false"></button>
        </div>
      </div>
    </section>

    <section id="cursos" class="mb-12">
    </section>

    <section id="horarios" class="mb-12">
    </section>

    <section id="contato" class="mb-12">
    </section>

    <section id="inscricao" class="mb-12">
    </section>

  </main>

  <footer class="bg-gray-800 text-white text-center py-4">
    <p>Vinicius Sousa - Tópicos avançados em programação</p>
  </footer>

  <script>
    const botaoMenu = document.getElementById("botaoMenu");
    const menu = document.getElementById("menu");

    botaoMenu.addEventListener("click", () => {
      menu.classList.toggle("hidden");
      const aberto = !menu.classList.contains("hidden");
      botaoMenu.setAttribute("aria-expanded", aberto);
    });

    const slides = document.getElementById("slides");
    const pontos = document.querySelectorAll(".ponto");
    let slideAtual = 0;

    function mostrarSlide(numero) {
      slideAtual = (numero + pontos.length) % pontos.length;
      slides.style.transform = `translateX(-${slideAtual * 100}%)`;

      pontos.forEach((ponto, indice) => {
        ponto.classList.toggle("opacity-50", indice !== slideAtual);
        ponto.setAttribute("aria-current", indice === slideAtual);
      });
    }

    document.getElementById("anterior").addEventListener("click", () => mostrarSlide(slideAtual - 1));
    document.getElementById("proximo").addEventListener("click", () => mostrarSlide(slideAtual + 1));

    pontos.forEach((ponto, indice) => {
      ponto.addEventListener("click", () => mostrarSlide(indice));
    });
  </script>

</body>
</html>
